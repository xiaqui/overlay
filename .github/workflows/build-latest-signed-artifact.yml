name: Build latest signed APK artifact

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-latest-signed-artifact.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-latest-signed-artifact.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/overlay-signing.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/overlay-signing.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Test, lint and build signed release
        run: gradle testDebugUnitTest lintDebug assembleRelease --no-daemon
      - name: Verify and stage APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp app/build/outputs/apk/release/app-release.apk delivery/Overlay.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs --min-sdk-version 23 delivery/Overlay.apk > delivery/SIGNATURE.txt
          EXPECTED=$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          grep -qi "certificate SHA-256 digest: $EXPECTED" delivery/SIGNATURE.txt
          "$TOOLS/aapt" dump badging delivery/Overlay.apk > delivery/PACKAGE.txt
          grep -q "package: name='com.xiaqui.overlay'" delivery/PACKAGE.txt
          sha256sum delivery/Overlay.apk > delivery/SHA256SUMS
          printf 'source_sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > delivery/PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Overlay-signed
          path: delivery/
          retention-days: 3
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/overlay-signing.jks"
