name: Build latest signed APK artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-latest-signed-artifact.yml'

permissions:
  contents: read

jobs:
  build:
    # The automatic path is a one-shot guard for the fourth/final merge in this Work.
    # Future main updates can only run this workflow through workflow_dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.before == '2d8741947c2ea0ea8e386bf9e95893cd8dff0166' }}
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install exact Android SDK tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/overlay-signing.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/overlay-signing.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Test, lint and build signed release
        run: gradle testDebugUnitTest lintDebug assembleRelease --no-daemon
      - name: Verify and stage APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp app/build/outputs/apk/release/app-release.apk delivery/Overlay.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs --min-sdk-version 23 delivery/Overlay.apk > delivery/SIGNATURE.txt
          EXPECTED=$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          grep -qi "certificate SHA-256 digest: $EXPECTED" delivery/SIGNATURE.txt
          "$TOOLS/aapt" dump badging delivery/Overlay.apk > delivery/PACKAGE.txt
          grep -q "package: name='com.xiaqui.overlay'" delivery/PACKAGE.txt
          grep -q "versionCode='6'" delivery/PACKAGE.txt
          grep -q "versionName='0.6.0-display-controls'" delivery/PACKAGE.txt
          grep -q "sdkVersion:'23'" delivery/PACKAGE.txt
          grep -q "targetSdkVersion:'25'" delivery/PACKAGE.txt
          if grep -q 'application-debuggable' delivery/PACKAGE.txt; then exit 1; fi
          if "$TOOLS/aapt" dump permissions delivery/Overlay.apk | grep -q 'android.permission.INTERNET'; then exit 1; fi
          mkdir -p "$RUNNER_TEMP/baseline"
          gh release download overlay-0.2.0-2f942bba --pattern Overlay.apk --dir "$RUNNER_TEMP/baseline"
          echo "a5fbf73e08e5e985a6b11c12fc81078d7f52f134cd3633b93c9a3892b472fe1b  $RUNNER_TEMP/baseline/Overlay.apk" | sha256sum -c -
          "$TOOLS/apksigner" verify --print-certs --min-sdk-version 23 "$RUNNER_TEMP/baseline/Overlay.apk" > "$RUNNER_TEMP/baseline-signature.txt"
          BASELINE=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/baseline-signature.txt")
          test "$EXPECTED" = "$BASELINE"
          sha256sum delivery/Overlay.apk > delivery/SHA256SUMS
          printf 'source_sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > delivery/PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Overlay-signed
          path: delivery/
          retention-days: 3
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/overlay-signing.jks"

