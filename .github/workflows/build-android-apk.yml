name: Overlay display finish checks and signed Release
on:
  workflow_dispatch:
  push:
    branches: [main, work/z3tc-status-diagnosis-20261111]
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/**', '.github/scripts/**']
  pull_request:
    branches: [main]
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/**', '.github/scripts/**']
permissions:
  contents: read
concurrency:
  group: overlay-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cleanup-obsolete-checks:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel older runs of this same PR workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.head_ref }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GH_REPO/actions/runs" -f event=pull_request -f branch="$PR_BRANCH" -f per_page=100 > "$RUNNER_TEMP/runs.json"
          jq -r --arg name "$WORKFLOW_NAME" --argjson current "$GITHUB_RUN_ID" '.workflow_runs[] | select(.name == $name and .id < $current and .status != "completed") | .id' "$RUNNER_TEMP/runs.json" | while read -r id; do
            gh api --method POST "repos/$GH_REPO/actions/runs/$id/cancel" || true
          done
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install exact SDK tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test, lint and build (no Artifact upload)
        run: gradle testDebugUnitTest assembleDebugAndroidTest lintDebug assembleDebug --no-daemon
  emulator:
    timeout-minutes: 15
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # API24 runs the bounded battery-finish suite; full lifecycle suite has a known exit hang.
        api: [23, 24, 26, 28, 29]
    env:
      OVERLAY_TEST_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Free unused hosted SDK space
        run: sudo rm -rf /usr/share/dotnet
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: Nexus 4
          disk-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/emulator-test.sh
  release:
    # Explicit accepted-binary promotion on the approved merge; never ordinary pushes or PRs.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-overlay-v1.0.0]') }}
    needs: [check, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install verification tools (no APK rebuild)
        run: sdkmanager 'build-tools;35.0.0'
      - name: Promote device-accepted signed APK to stable Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/promote-accepted-v1.sh
